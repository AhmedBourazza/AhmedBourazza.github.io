<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <meta name="description" content="Interactive 3D portfolio of Ahmed Bourazza, computer science engineer." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- the import map must come before any module or modulepreload, or "three" can't be resolved -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <!-- start downloading three.js right away, in parallel with the rest of the page -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" crossorigin />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/BufferGeometryUtils.js" crossorigin />
  <link rel="modulepreload" href="data.js" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="scene"></canvas>

  <nav class="nav">
    <button data-go="accueil" class="active">Home</button>
    <button data-go="apropos">About</button>
    <button data-go="projets">Projects</button>
    <button data-go="contact">Contact</button>
  </nav>

  <div class="socials">
    <a id="s-github" target="_blank" rel="noopener" aria-label="GitHub">
      <svg viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
    </a>
    <a id="s-linkedin" target="_blank" rel="noopener" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2zM4 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
    </a>
    <a id="s-instagram" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.6"/></svg>
    </a>
    <a id="s-mail" aria-label="Email">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
    </a>
  </div>

  <p id="hint" class="hint">Scroll or use the arrow keys to move through the office</p>

  <aside id="panel" class="panel" aria-live="polite">
    <button id="panel-close" class="close" aria-label="Close">×</button>
    <div id="panel-body"></div>
  </aside>

  <div id="intro" class="intro">
    <div id="loader" class="loader"><span></span>Loading…</div>
    <div class="intro-card">
      <p class="eyebrow">Computer Science Engineer</p>
      <h1>Ahmed Bourazza</h1>
      <p>An interactive view of my work. Walk through the office to see my experience, projects and how to reach me.</p>
      <button id="enter" class="btn primary">Enter</button>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
